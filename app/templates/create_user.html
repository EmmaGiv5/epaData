{% extends "base.html" %}

{% block title %}
Create User | epaData
{% endblock %}

{% block content %}

<div class="loginBox">

    <div class="welcomeBox">
        <h2>Create a new account.</h2>
    </div>

    <div class="login">

        <h2>Create User</h2>

        <form method="POST"
              action="{{ url_for('main.create_user') }}">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <label for="confirm_password">
                Confirm Password:
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >

            <br><br>

            <button class="login-btn" type="submit">
                Create User
            </button>

        </form>

        <br>

        <a href="{{ url_for('main.login') }}">
            Already have an account? Log in
        </a>

    </div>

</div>

{% endblock %}
