<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    <title>Login | epaData</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='js/css/style.css') }}">

</head>

<body>

    <!-- login box -->

    <div class="loginBox">

        <div class="welcomeBox">
            <h2>Login below with your email and password.</h2>
        </div>

        <div class="login">

            <h2>Log In</h2>

            <form method="POST" action="{{ url_for('main.login') }}">

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <br><br>

                <button class="login-btn" type="submit">
                    Login
                </button>

            </form>

            <br>

            <a href="{{ url_for('main.create_user') }}">
                Create a new user
            </a>

            <br>

            <a href="#">
                Forgot password?
            </a>

        </div>

    </div>
</body>
</html>
