{% extends "base.html" %}

{% block title %}
Login | epaData
{% endblock %}

{% block content %}

<!-- login box -->

<div class="loginBox">

    <div class="welcomeBox">
        <h2>Login below with your email and password.</h2>
    </div>

    <div class="login">

        <h2>Log In</h2>

        <form method="POST" action="{{ url_for('main.login') }}">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="{{ url_for('main.create_user') }}">
            Create a new user
        </a>

        <br>

        <a href="#">
            Forgot password?
        </a>

    </div>

</div>

{% endblock %}
